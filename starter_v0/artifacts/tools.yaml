# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại người dùng khi THIẾU THÔNG TIN bắt buộc (ví dụ: thiếu handle/URL) hoặc YÊU CẦU XÁC NHẬN (yes/no) trước các hành động gửi/đăng bài ra ngoài."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Nội dung câu hỏi dành cho người dùng"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu phản hồi cần nhận: 'text' khi cần xin thêm thông tin, 'yes_no' khi cần xác nhận hành động"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Trích xuất danh sách bài đăng/tweet của MỘT CÁ NHÂN HOẶC TÀI KHOẢN CỤ THỂ (ví dụ: Sam Altman -> sama, Elon Musk -> elonmusk)."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Twitter/X handle của tài khoản (ví dụ: sama, elonmusk, karpathy)"}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng cần lấy"}
      required: [screenname]

  - name: social_search
    description: "Tìm kiếm các bài đăng trên mạng xã hội theo CHỦ ĐỀ HOẶC TỪ KHÓA (không thuộc về một cá nhân cụ thể)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa hoặc chủ đề tìm kiếm"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Sắp xếp theo 'Top' (phổ biến nhất) hoặc 'Latest' (mới nhất)"}
        limit: {type: integer, default: 5, description: "Số lượng kết quả cần lấy"}
      required: [query]

  - name: lookup
    description: "Tìm kiếm bài viết hoặc tin tức trên internet theo từ khóa. Dùng topic='news' cho tin thời sự, timeframe='day' cho hôm nay, 'week' cho tuần này."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại: 'news' cho tin tức/thời sự, 'general' cho thông tin chung"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian: 'day' (hôm nay), 'week' (tuần này), 'month', 'year'"}
        max_results: {type: integer, default: 5, description: "Số kết quả tối đa"}
      required: [query]

  - name: fetch
    description: "Đọc nội dung chi tiết từ một URL cụ thể được cung cấp trực tiếp trong câu hỏi."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ URL cụ thể"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  - name: extract_method_results
    description: "Trích xuất các phần Phương pháp (Methodology), Kết quả (Results), Tóm tắt (Abstract) và Kết luận từ file text bài báo."
    parameters:
      type: object
      properties:
        txt_path: {type: string, default: "", description: "Đường dẫn file .txt bài báo"}
        raw_text: {type: string, default: "", description: "Nội dung văn bản trực tiếp"}
      required: []

  - name: rank_papers
    description: "Lọc và xếp hạng danh sách bài báo dựa trên độ liên quan tới chủ đề nghiên cứu."
    parameters:
      type: object
      properties:
        papers:
          type: array
          default: []
          description: "Danh sách bài báo từ tool papers"
          items:
            type: object
        query: {type: string, default: "", description: "Chủ đề nghiên cứu"}
        top_k: {type: integer, default: 3, description: "Số bài báo chọn lấy"}
      required: [query]

  - name: summarize_paper
    description: "Tạo bản tóm tắt báo cáo nghiên cứu dạng Markdown từ metadata và các phần đã trích xuất."
    parameters:
      type: object
      properties:
        title: {type: string, default: "", description: "Tiêu đề bài báo"}
        authors: {type: array, items: {type: string}, default: [], description: "Danh sách tác giả"}
        year: {type: string, default: "", description: "Năm xuất bản"}
        abstract: {type: string, default: "", description: "Tóm tắt abstract"}
        methodology: {type: string, default: "", description: "Phương pháp nghiên cứu"}
        results: {type: string, default: "", description: "Kết quả nghiên cứu"}
      required: [title]

