# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại người dùng khi thiếu thông tin bắt buộc (ví dụ: không biết tìm chủ đề gì, không có URL, không có handle). Cũng dùng để xác nhận trước hành động nhạy cảm như gửi/đăng bài (response_type=yes_no). KHÔNG đoán bừa khi thiếu thông tin quan trọng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi cần hỏi người dùng"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời mong đợi. Dùng 'text' khi cần thông tin, 'yes_no' khi cần xác nhận."}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn (chỉ dùng khi response_type=choice)"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tìm kiếm thông tin trên web/internet. Dùng khi user muốn tra cứu khái niệm, định nghĩa, tin tức, hoặc thông tin tổng hợp từ web. Với viết tắt kèm tên đầy đủ, đặt viết tắt trước (ví dụ: 'RLHF Reinforcement Learning from Human Feedback'). Truyền query dạng plain text, không thêm dấu ngoặc kép."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm, truyền plain text không thêm dấu ngoặc kép"}
        topic: {type: string, enum: [general, news], default: "general", description: "general cho tra cứu thông thường, news cho tin tức thời sự"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian: 'hôm nay'→day, 'tuần này'→week"}
        max_results: {type: integer, default: 5, description: "Số kết quả tối đa"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày và định dạng lại dữ liệu/thông tin đã có thành văn bản có cấu trúc. Dùng khi user yêu cầu format, trình bày, tổng hợp thành dạng bullets/sections/brief/thread. KHÔNG dùng để tìm kiếm — chỉ dùng để định dạng lại thông tin sẵn có."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item cần format"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn mẫu trình bày: 'bullets' cho danh sách, 'sections' cho báo cáo có mục, 'brief' cho tóm tắt ngắn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học trên arXiv theo từ khóa. Truyền query dạng plain text, KHÔNG thêm dấu ngoặc kép quanh từ khóa."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm, truyền plain text (ví dụ: 'Masked Language Modeling', KHÔNG viết '\"Masked Language Modeling\"')"}
        max_results: {type: integer, default: 5, description: "Số lượng kết quả"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Cách sắp xếp: 'mới nhất'→submittedDate"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  - name: find_paper_code
    description: "Tìm kiếm mã nguồn (source code) hoặc repository trên Github liên quan đến bài báo."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Tên bài báo hoặc từ khóa"}
        max_results: {type: integer, default: 3, description: "Số kết quả tối đa"}
      required: [query]

  - name: extract_method_results
    description: "Trích xuất các phần Phương pháp (Methodology), Kết quả (Results), Tóm tắt (Abstract) và Kết luận từ file text bài báo."
    parameters:
      type: object
      properties:
        txt_path: {type: string, default: "", description: "Đường dẫn file .txt bài báo"}
        raw_text: {type: string, default: "", description: "Nội dung văn bản trực tiếp"}
      required: []

  - name: rank_papers
    description: "Lọc và xếp hạng danh sách bài báo dựa trên độ liên quan tới chủ đề nghiên cứu."
    parameters:
      type: object
      properties:
        papers:
          type: array
          default: []
          description: "Danh sách bài báo từ tool papers"
          items:
            type: object
        query: {type: string, default: "", description: "Chủ đề nghiên cứu"}
        top_k: {type: integer, default: 3, description: "Số bài báo chọn lấy"}
      required: [query]

  - name: summarize_paper
    description: "Tạo bản tóm tắt báo cáo nghiên cứu dạng Markdown từ metadata và các phần đã trích xuất."
    parameters:
      type: object
      properties:
        title: {type: string, default: "", description: "Tiêu đề bài báo"}
        authors: {type: array, items: {type: string}, default: [], description: "Danh sách tác giả"}
        year: {type: string, default: "", description: "Năm xuất bản"}
        abstract: {type: string, default: "", description: "Tóm tắt abstract"}
        methodology: {type: string, default: "", description: "Phương pháp nghiên cứu"}
        results: {type: string, default: "", description: "Kết quả nghiên cứu"}
      required: [title]
